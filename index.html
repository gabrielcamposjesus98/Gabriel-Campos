<!doctype html>
<html lang="pt-BR">
<head>

<title>Finanças Isabela & Gabriel</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
body.anon .month,body.anon nav.tabs,body.anon #fab{display:none!important}
textarea{font:inherit}

:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --surface-2:#F7F8F6; --line:#DEE3DE; --line-2:#EBEEEA;
  --ink:#152027; --muted:#5D6B70; --faint:#8B979A;
  --accent:#0E6B60; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --pos:#1D8049; --pos-soft:#DDF1E3; --neg:#BF3B28; --neg-soft:#F8E1DC; --warn:#A96B12; --warn-soft:#F7EBD3;
  --s-receita:#1D8049; --s-fixo:#3E5F8A; --s-divida:#9A3F2B; --s-parcela:#6D4FA3; --s-variavel:#0E6B60;
  --shadow:0 1px 2px rgba(21,32,39,.06),0 8px 24px rgba(21,32,39,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1315; --surface:#172024; --surface-2:#1B262A; --line:#2A373C; --line-2:#223034;
  --ink:#E5ECEA; --muted:#9AA9AC; --faint:#6F7F83;
  --accent:#4BBFAA; --accent-ink:#06201C; --accent-soft:#16352F;
  --pos:#5BC98A; --pos-soft:#15301F; --neg:#F07B66; --neg-soft:#3A1D18; --warn:#E3AE55; --warn-soft:#352812;
  --s-receita:#5BC98A; --s-fixo:#86A7D6; --s-divida:#E08A74; --s-parcela:#B39BE6; --s-variavel:#4BBFAA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ground:#0E1315; --surface:#172024; --surface-2:#1B262A; --line:#2A373C; --line-2:#223034;
  --ink:#E5ECEA; --muted:#9AA9AC; --faint:#6F7F83;
  --accent:#4BBFAA; --accent-ink:#06201C; --accent-soft:#16352F;
  --pos:#5BC98A; --pos-soft:#15301F; --neg:#F07B66; --neg-soft:#3A1D18; --warn:#E3AE55; --warn-soft:#352812;
  --s-receita:#5BC98A; --s-fixo:#86A7D6; --s-divida:#E08A74; --s-parcela:#B39BE6; --s-variavel:#4BBFAA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:32px;height:32px;border-radius:999px;cursor:pointer;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--surface-2);color:var(--ink)}
.month select{border:0;background:transparent;font-weight:600;padding:4px 2px;cursor:pointer;min-width:96px;text-align:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--neg);border-color:var(--neg-soft);background:var(--neg-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:9px 12px 11px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 12px;letter-spacing:-.005em;text-wrap:balance}
.panel h2 .sub{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.saldo{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,48px);letter-spacing:-.02em;line-height:1.05;margin:6px 0 4px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.flow{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.flow-row{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:3px}
.bar{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)}.pill.at{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--neg-soft);color:var(--neg)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.insights{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.insights .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
/* list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0}
.toolbar input{flex:1 1 200px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.sec{border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.sec-h h3{margin:0;font-size:15px;font-weight:700;margin-right:auto}
.sec-h .count{color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 16px 10px 13px;border-bottom:1px solid var(--line-2);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:3px solid transparent;border-right:0;border-top:0}
.row.hascat{border-left-color:hsl(var(--ch) 26% 62%)}
.cat{display:inline-block;padding:1px 7px;border-radius:5px;font-weight:600;font-size:12px;background:hsl(var(--ch) 34% 93%);color:hsl(var(--ch) 30% 30%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat{background:hsl(var(--ch) 20% 20%);color:hsl(var(--ch) 38% 75%)}
 :root:not([data-theme="light"]) .row.hascat{border-left-color:hsl(var(--ch) 28% 44%)}}
:root[data-theme="dark"] .cat{background:hsl(var(--ch) 20% 20%);color:hsl(var(--ch) 38% 75%)}
:root[data-theme="dark"] .row.hascat{border-left-color:hsl(var(--ch) 28% 44%)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .d{font-weight:600;overflow-wrap:anywhere}
.row .meta{grid-column:1;font-size:12.5px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap}
.row .v{grid-row:1/span 2;grid-column:2;align-self:center;font-weight:600;text-align:right}
.empty{padding:18px 16px;color:var(--muted);font-size:14px}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
thead th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
thead th:first-child{background:var(--surface-2)}
tr.total td{font-weight:700;border-top:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.est{font-style:italic;color:var(--muted)}
td.cur,th.cur{background:var(--accent-soft)}
/* cards (faturas) */
.fat{display:flex;flex-direction:column;gap:10px}
.fat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.fat-val{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.01em}
.fat-cfg{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.fat-cfg input{width:56px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface);text-align:center}
.catline{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
/* debts */
.debt{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.debt:last-child{border-bottom:0}
.debt .t{font-weight:700}
.debt .m{font-size:12.5px;color:var(--muted)}
.debt .bar{grid-column:1/-1;height:8px}
.gauge{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gauge .big{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.02em}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
/* investimentos */
.inv{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.inv-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.inv-h .m{font-size:12.5px;color:var(--muted)}
.inv-acts{display:flex;gap:8px;flex-wrap:wrap}
.movs{border-top:1px solid var(--line-2);padding-top:8px;display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.mov{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 2px;border-bottom:1px solid var(--line-2)}
.mov:last-child{border-bottom:0}
.mov button{border:0;background:transparent;color:var(--neg);cursor:pointer;font-size:12px;font-weight:600}
.meta-goal{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,16,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){.ov{align-items:center}}
.modal{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;box-shadow:var(--shadow);padding:18px}
.modal h3{font-family:var(--display);font-size:20px;margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:460px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);width:100%}
.field .hint{font-size:12px;color:var(--faint)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.box{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:999px;padding:14px 20px;box-shadow:var(--shadow);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.banner{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px}
.help{max-width:70ch}
.help h3{font-family:var(--display);font-size:17px;margin:18px 0 6px}
.help p,.help li{color:var(--ink)}
.help ol,.help ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.switch button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

/* ---------- envio direto para o Google Agenda ---------- */
const B32="0123456789abcdefghijklmnopqrstuv";
function idEvento(s){
  let h1=0x811c9dc5,h2=0x01000193;
  for(let i=0;i<s.length;i++){h1=(h1^s.charCodeAt(i))*16777619>>>0;h2=(h2+s.charCodeAt(i)*(i+7))>>>0;}
  let out="ev";for(const h of [h1,h2]){let v=h;for(let i=0;i<7;i++){out+=B32[v&31];v>>>=5;}}
  return out;
}
window.__gcalSync=async function(){
  const prov=new GoogleAuthProvider();
  prov.addScope("https://www.googleapis.com/auth/calendar.app.created");
  toast("Abrindo o login do Google…");
  const res=await signInWithPopup(AUTH,prov);
  const cred=GoogleAuthProvider.credentialFromResult(res);
  const tk=cred&&cred.accessToken;
  if(!tk){toast("O Google não liberou o acesso à agenda.");return;}
  const H={Authorization:"Bearer "+tk,"Content-Type":"application/json"};
  let calId=null;try{calId=localStorage.getItem("fin.calid");}catch(e){}
  if(!calId){
    const r=await fetch("https://www.googleapis.com/calendar/v3/calendars",{method:"POST",headers:H,
      body:JSON.stringify({summary:"Contas da casa",timeZone:"America/Sao_Paulo"})});
    if(!r.ok)throw new Error("não consegui criar a agenda ("+r.status+")");
    calId=(await r.json()).id;try{localStorage.setItem("fin.calid",calId);}catch(e){}
  }
  const {eventos}=eventosAgenda();
  const lim=addDias(hojeD(),-40);
  const lista=eventos.filter(e=>e.data>=lim);
  let ok=0;
  for(const e of lista){
    const corpo={id:idEvento(e.id),summary:e.titulo+" · "+R(e.valor),
      description:(e.tipo==="fatura"?"Fatura fechada do cartão":e.tipo==="divida"?"Parcela de dívida":"Conta fixa")+(e.forma?" · "+e.forma:""),
      start:{date:e.data},end:{date:addDias(e.data,1)},transparency:"transparent",
      reminders:{useDefault:false,overrides:[{method:"popup",minutes:900}]}};
    let r=await fetch("https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(calId)+"/events",{method:"POST",headers:H,body:JSON.stringify(corpo)});
    if(r.status===409)r=await fetch("https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(calId)+"/events/"+corpo.id,{method:"PUT",headers:H,body:JSON.stringify(corpo)});
    if(r.ok)ok++;
  }
  toast(ok+" vencimentos enviados para a agenda \u201cContas da casa\u201d");
};

function dicas(m,r,ant){
  const out=[];
  const top=Object.entries(r.cat).filter(([c])=>c!=="Dívidas").sort((a,b)=>b[1]-a[1]);
  if(top.length&&r.saidas){out.push(["1",`<b>${esc(top[0][0])}</b> é a maior categoria do mês: ${R(top[0][1])} (${pct(top[0][1]/r.saidas)} do total).`]);}
  const sub=Object.entries(r.cat).map(([c,v])=>[c,v-(ant.cat[c]||0),ant.cat[c]||0]).filter(x=>x[2]>0&&x[0]!=="Dívidas").sort((a,b)=>b[1]-a[1]);
  if(sub.length&&sub[0][1]>50)out.push(["↑",`<b>${esc(sub[0][0])}</b> subiu ${R(sub[0][1])} em relação a ${mLabel(addM(m,-1))}.`]);
  const fora=(r.cat["Restaurante"]||0)+(r.cat["Lazer & Bar"]||0);
  if(fora>0&&r.receita)out.push(["$",`Restaurante + Lazer & Bar somam ${R(fora)} (${pct(fora/r.receita)} da receita). Cortar 20% aqui libera ${R(fora*.2)} no mês.`]);
  const ass=r.cat["Assinaturas"]||0;
  if(ass>0)out.push(["↻",`Assinaturas custam ${R(ass)} por mês, ou ${R(ass*12)} por ano. Vale revisar o que não está sendo usado.`]);
  if(r.receita&&r.saldo<0)out.push(["!",`O mês fecha negativo em ${R(-r.saldo)}. Priorize adiar compras novas no cartão até a fatura normalizar.`]);
  else if(r.receita&&r.saldo>0)out.push(["✓",`Sobra de ${R(r.saldo)}. Separar parte disso para a reserva de emergência (meta: 6 meses de custo fixo) é o próximo passo.`]);
  if(!out.length)out.push(["i","Lance receitas e gastos deste mês para ver a leitura aqui."]);
  return out.slice(0,5);
}

function calcDividas(ref){
  const g={};
  for(const k of Object.keys(S.meses))for(const it of itens(k)){
    if(it.secao==="receita")continue;const p=parseParc(it.parcela);if(!p||p.n<2)continue;
    const key=norm(it.desc)+"|"+p.n+"|"+Math.round((+it.valor||0)*100);
    (g[key]=g[key]||{desc:(it.desc||"").trim(),forma:it.forma,n:p.n,secao:it.secao,its:[]}).its.push({mes:k,k:p.k,v:+it.valor||0});
  }
  const out=[];
  for(const x of Object.values(g)){
    x.its.sort((a,b)=>a.k-b.k);const first=x.its[0],last=x.its[x.its.length-1];
    const antes=(first.k-1)*first.v,depois=Math.max(0,x.n-last.k)*last.v;
    const total=antes+x.its.reduce((a,i)=>a+i.v,0)+depois;
    const pago=antes+x.its.filter(i=>i.mes<=ref).reduce((a,i)=>a+i.v,0);
    const quita=addM(last.mes,Math.max(0,x.n-last.k));
    const inicio=addM(first.mes,-(first.k-1));
    const atual=x.its.filter(i=>i.mes<=ref).map(i=>i.k).pop()||first.k-1;
    const noMes=x.its.filter(i=>i.mes===ref).reduce((a,i)=>a+i.v,0);
    if(total-pago>0.009&&inicio<=addM(ref,12))out.push({...x,total,pago,falta:total-pago,quita,inicio,atual,parcela:last.v,noMes});
  }
  return out.sort((a,b)=>b.falta-a.falta);
}

/* ---------- agenda de vencimentos ----------
   Entram só as contas que se paga uma a uma:
   - a fatura fechada de cada cartão (uma por cartão, não as compras de dentro dela)
   - endividamentos fora do cartão (financiamento, acordo, consórcio)
   - gastos fixos fora do cartão (água, luz, internet, mensalidades)
   Ficam de fora: compras parceladas no cartão e gastos do mês.            */
const diaMes=(m,d)=>{const[y,mm]=m.split("-").map(Number);const ult=new Date(y,mm,0).getDate();return `${m}-${String(Math.min(Math.max(1,d),ult)).padStart(2,"0")}`;};
function eventosAgenda(){
  const out=[],semData=[];
  for(const m of Object.keys(S.meses)){
    S.config.cartoes.forEach(c=>{
      const tot=itens(m).filter(i=>i.forma===c.nome).reduce((a,i)=>a+(+i.valor||0),0);
      if(tot>0.009){
        if(c.vencimento) out.push({id:"fatura|"+c.nome+"|"+m,data:diaMes(m,+c.vencimento),titulo:"Fatura "+c.nome,valor:tot,tipo:"fatura",mes:m});
        else semData.push({titulo:"Fatura "+c.nome+" ("+mLabel(m)+")",motivo:"falta o dia de vencimento do cartão"});
      }
    });
    itens(m).forEach(i=>{
      if((i.secao!=="fixo"&&i.secao!=="divida")||isCartao(i.forma))return;
      if(!i.valor)return;
      const t=(i.desc||"Conta")+(i.parcela?" "+i.parcela:"");
      if(i.data) out.push({id:"conta|"+m+"|"+i.id,data:i.data,titulo:t,valor:i.valor,tipo:i.secao,forma:i.forma,mes:m});
      else semData.push({titulo:t+" ("+mLabel(m)+")",motivo:"falta a data no lançamento"});
    });
  }
  out.sort((a,b)=>a.data.localeCompare(b.data)||b.valor-a.valor);
  return {eventos:out,semData};
}
/* ---------- baixar arquivo (funciona no app hospedado e no artifact) ---------- */
async function baixarArquivo(nome,texto,tipo){
  try{
    if(window.claude&&window.claude.use){
      const dl=await window.claude.use("downloads");
      if(dl){await dl.save({filename:nome,data:texto});toast("Arquivo gerado");return;}
    }
  }catch(e){}
  try{
    const b=new Blob([texto],{type:tipo+";charset=utf-8"});const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=nome;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},600);toast("Arquivo baixado");
  }catch(e){toast("Não foi possível baixar o arquivo aqui.");}
}

const addDias=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
function icsTexto(){
  const {eventos}=eventosAgenda();

  const esc2=t=>String(t).replace(/([,;\\\\])/g,"\\\\$1").replace(/\n/g,"\\\\n");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Financas Isabela e Gabriel//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Contas da casa","X-WR-TIMEZONE:America/Sao_Paulo"];
  eventos.filter(e=>e.data>=addDias(hoje,-40)).forEach(e=>{
    const d=e.data.replace(/-/g,"");
    L.push("BEGIN:VEVENT","UID:"+e.id.replace(/[^a-zA-Z0-9-]/g,"-")+"@financas.casa","DTSTAMP:"+stamp,
      "DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+addDias(e.data,1).replace(/-/g,""),
      "SUMMARY:"+esc2(e.titulo+" · "+R(e.valor)),
      "DESCRIPTION:"+esc2((e.tipo==="fatura"?"Fatura fechada do cartão":e.tipo==="divida"?"Parcela de dívida":"Conta fixa")+(e.forma?" · "+e.forma:"")+" · lançado no controle financeiro da casa"),
      "TRANSP:TRANSPARENT","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc2(e.titulo),"TRIGGER;RELATED=START:-PT15H","END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}

function vRelatorios(){
  const l=listaMeses();const cur=S.mes;
  const ini=l.indexOf(cur);const ms=l.slice(Math.max(0,Math.min(ini-3,l.length-12)),Math.max(0,Math.min(ini-3,l.length-12))+12);
  const P=ms.map(projecao);
  // chart
  const W=760,H=240,pl=56,pr=10,pt=14,pb=28;const vals=P.flatMap(p=>[p.saldo]);let mx=Math.max(1,...vals),mn=Math.min(0,...vals);
  const niceStep=v=>{const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=2?2:f<=5?5:10)*e;};
  const step=niceStep((mx-mn)/4);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;
  const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);const bw=(W-pl-pr)/ms.length;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo por mês">`;
  for(let v=mn;v<=mx+1e-6;v+=step){svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})}k</text>`;}
  svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--faint)" stroke-width="1"/>`;
  P.forEach((p,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;const y0=y(0),y1=y(p.saldo);const est=p.est.receita||p.est.variavel||p.est.fixo;
    svg+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${w}" height="${Math.max(1,Math.abs(y1-y0))}" rx="3" fill="${p.saldo>=0?"var(--pos)":"var(--neg)"}" fill-opacity="${est?0.45:0.9}" ${ms[i]===cur?'stroke="var(--ink)" stroke-width="1.5"':""}><title>${mLabel(ms[i])}: ${R(p.saldo)}${est?" (com estimativa)":""}</title></rect>
    <text x="${x+w/2}" y="${H-10}" text-anchor="middle"${ms[i]===cur?' style="font-weight:700;fill:var(--ink)"':""}>${MESES[+ms[i].slice(5)-1]}${ms[i].slice(5)==="01"?" "+ms[i].slice(2,4):""}</text>`;});
  svg+="</svg>";
  const linhas=[["Receitas","receita"],["Gastos fixos","fixo"],["Endividamentos","divida"],["Parcelas","parcela"],["Gastos do mês","variavel"]];
  const th=ms.map(m=>`<th class="${m===cur?"cur":""}">${mLabel(m)}</th>`).join("");
  const tbl1=`<div class="tbl-wrap"><table><thead><tr><th>Resumo</th>${th}</tr></thead><tbody>
    ${linhas.map(([n,k])=>`<tr><td>${n}</td>${P.map((p,i)=>`<td class="num ${(k==="receita"&&p.est.receita)||(k==="variavel"&&p.est.variavel)||(k==="fixo"&&p.est.fixo)?"est":""} ${ms[i]===cur?"cur":""}">${p[k]?R(p[k]):"–"}</td>`).join("")}</tr>`).join("")}
    <tr class="total"><td>Saldo</td>${P.map((p,i)=>`<td class="num ${p.saldo>=0?"pos":"neg"} ${ms[i]===cur?"cur":""}">${R(p.saldo)}</td>`).join("")}</tr>
    <tr><td>Saldo acumulado</td>${(()=>{let a=0;return P.map((p,i)=>{a+=p.saldo;return `<td class="num ${a>=0?"":"neg"} ${ms[i]===cur?"cur":""}">${R(a)}</td>`;}).join("");})()}</tr>
  </tbody></table></div>`;
  // categorias / formas
  const agg={};const porCompra=S.relModo==="compra"&&S.relTipo==="categoria";
  for(const k of Object.keys(S.meses))for(const it of itens(k)){if(it.secao==="receita")continue;
    const mm=porCompra&&it.data?mOf(it.data):k;if(!ms.includes(mm))continue;
    const key=S.relTipo==="categoria"?(it.cat||(it.secao==="divida"?"Dívidas":"Sem categoria")):(it.forma||"Não informado");
    (agg[key]=agg[key]||{})[mm]=(agg[key][mm]||0)+(+it.valor||0);}
  const keys=Object.keys(agg).sort((a,b)=>{const sa=Object.values(agg[a]).reduce((x,y)=>x+y,0),sb=Object.values(agg[b]).reduce((x,y)=>x+y,0);return sb-sa;});
  const tot=ms.map(m=>keys.reduce((a,k)=>a+(agg[k][m]||0),0));
  const tbl2=`<div class="tbl-wrap"><table><thead><tr><th>${S.relTipo==="categoria"?"Categoria":"Forma de pagamento"}</th>${th}</tr></thead><tbody>
    ${keys.map(k=>`<tr><td>${esc(k)}</td>${ms.map(m=>`<td class="num ${m===cur?"cur":""}">${agg[k][m]?R(agg[k][m]):"–"}</td>`).join("")}</tr>`).join("")}
    <tr class="total"><td>Total</td>${tot.map((v,i)=>`<td class="num ${ms[i]===cur?"cur":""}">${R(v)}</td>`).join("")}</tr></tbody></table></div>`;
  return `<section class="panel"><div class="fat-top"><h2 style="margin:0">Projeção dos próximos meses</h2>
      <label class="check"><input type="checkbox" id="estimar" ${S.estimar?"checked":""}> Estimar o que ainda não foi lançado</label></div>
      <div class="muted" style="font-size:13px;margin:6px 0 10px">Barras claras e valores em itálico usam estimativa: última receita e último total de gastos fixos lançados, e a média dos gastos do mês dos 3 últimos meses.</div>
      <div class="chart">${svg}</div></section>
    ${tbl1}
    <section class="grid" style="gap:10px"><div class="toolbar">
      <div class="switch" role="group" aria-label="Agrupar por"><button data-rel-tipo="categoria" aria-pressed="${S.relTipo==="categoria"}">Por categoria</button><button data-rel-tipo="forma" aria-pressed="${S.relTipo==="forma"}">Por forma de pagamento</button></div>
      ${S.relTipo==="categoria"?`<div class="switch" role="group" aria-label="Mês de referência"><button data-rel-modo="pagamento" aria-pressed="${S.relModo==="pagamento"}">Mês do pagamento</button><button data-rel-modo="compra" aria-pressed="${S.relModo==="compra"}">Mês da compra</button></div>`:""}
    </div>${tbl2}</section>`;
}

let M=null,MI=null; // estado dos formulários (lançamento / investimento)
function abrirForm(item,mes){

  const fOpts=`<option value="">(não informado)</option>`+[...new Set([...FORMAS,...S.config.cartoes.map(c=>c.nome),it.forma].filter(Boolean))].map(c=>`<option${c===it.forma?" selected":""}>${esc(c)}</option>`).join("");
  const ms=listaMeses();const mm=mes||S.mes;if(!ms.includes(mm))ms.push(mm);

  document.getElementById("modal-root").innerHTML=`<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt">${novo?"Novo lançamento":"Editar lançamento"}</h3>
    <div class="form">
      <div class="field full"><label>Tipo</label><div class="seg" id="f-tipo">${ORDEM.map(s=>`<button type="button" data-sec="${s}" aria-pressed="${s===M.secao}">${SECOES[s].curto}</button>`).join("")}</div></div>
      <div class="field full"><label for="f-desc">Descrição</label><input id="f-desc" value="${esc(it.desc||"")}" placeholder="Ex.: Mercado Pague Menos" autocomplete="off"></div>
      <div class="field"><label for="f-valor">Valor (R$)</label><input id="f-valor" data-money inputmode="decimal" value="${fmtIn(it.valor)}" placeholder="0,00"></div>
      <div class="field"><label for="f-data">Data da compra</label><input id="f-data" type="date" value="${esc(d)}"></div>
      <div class="field"><label for="f-cat">Categoria</label><select id="f-cat">${catOpts}</select></div>
      <div class="field"><label for="f-forma">Forma de pagamento</label><select id="f-forma">${fOpts}</select></div>
      <div class="field"><label for="f-mes">Mês da fatura / pagamento</label><select id="f-mes">${mOpts}</select><span class="hint" id="f-mes-hint"></span></div>
      <div class="field"><label for="f-parc">Parcela</label><input id="f-parc" value="${esc(it.parcela||"")}" placeholder="Ex.: 3/10"></div>
      ${novo?`<div class="box full" id="f-extra"></div>`:""}
    </div>
    <div class="actions">${novo?"":`<button class="btn danger left" id="f-del">Excluir</button>`}<button class="btn" id="f-cancel">Cancelar</button><button class="btn primary" id="f-save">Salvar</button></div>
  </div></div>`;

function atualizarForm(){
  document.querySelectorAll("#f-tipo button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sec===M.secao));
  const ex=document.getElementById("f-extra");
  if(ex){
    if(M.secao==="variavel"||M.secao==="parcela"){ex.hidden=false;
      if(!ex.dataset.k||ex.dataset.k!=="parc"){ex.dataset.k="parc";ex.innerHTML=`<label class="check full" style="grid-column:1/-1"><input type="checkbox" id="x-parc"${M.secao==="parcela"?" checked":""}> Compra parcelada</label>

        <div class="field"><label for="x-k">Começar da parcela</label><input id="x-k" inputmode="numeric" value="1"></div>
        <div class="hint" style="grid-column:1/-1;font-size:12px;color:var(--faint)">O valor informado é o de cada parcela. Uma parcela é lançada em cada mês a partir do mês da fatura.</div>`;}
    } else if(M.secao==="fixo"||M.secao==="divida"||M.secao==="receita"){ex.hidden=false;
      if(ex.dataset.k!=="rep"){ex.dataset.k="rep";ex.innerHTML=`<div class="field"><label for="x-rep">Repetir nos próximos meses</label><select id="x-rep">${[0,1,2,3,5,11].map(n=>`<option value="${n}">${n?"+ "+n+(n===1?" mês":" meses"):"Só este mês"}</option>`).join("")}</select></div>`;}
    }

function sugerirMes(){
  const h=document.getElementById("f-mes-hint");if(!h)return;
  const data=document.getElementById("f-data").value,forma=document.getElementById("f-forma").value;
  if(M.secao==="variavel"||M.secao==="parcela"){
    const sug=data?mesFatura(data,forma):null;
    if(sug&&!M.mesManual){const sel=document.getElementById("f-mes");if(![...sel.options].some(o=>o.value===sug)){const o=document.createElement("option");o.value=sug;o.textContent=mLabel(sug);sel.appendChild(o);}sel.value=sug;}
    h.textContent=sug?(isCartao(forma)?"Pela data e pelo fechamento do cartão, cai na fatura de "+mLabel(sug)+".":"Pago no mês da compra."):"";
  } else h.textContent="";
}
function fecharForm(){document.getElementById("modal-root").innerHTML="";M=null;MI=null;}
async function salvarForm(){
  const g=id=>document.getElementById(id);
  const valor=parseValor(g("f-valor").value);const desc=g("f-desc").value.trim();
  if(!desc){toast("Preencha a descrição.");g("f-desc").focus();return;}
  if(!isFinite(valor)){toast("Informe o valor, ex.: 125,90");g("f-valor").focus();return;}
  const base={secao:M.secao,desc,valor};
  const data=g("f-data").value,cat=g("f-cat").value,forma=g("f-forma").value,parc=g("f-parc").value.trim();
  if(data)base.data=data;if(cat)base.cat=cat;if(forma)base.forma=forma;if(parc)base.parcela=parc;
  const mes=g("f-mes").value;
  const btn=g("f-save");btn.disabled=true;btn.textContent="Salvando…";
  try{
    if(!M.novo){
      const id=M.orig.id;const it={...base,id};
      if(mes===M.origMes)await mutarMes(mes,d=>{const i=d.itens.findIndex(x=>x.id===id);if(i>=0)d.itens[i]=it;else d.itens.push(it);});
      else{await mutarMes(M.origMes,d=>{d.itens=d.itens.filter(x=>x.id!==id);});await mutarMes(mes,d=>{d.itens.push(it);});}
      toast("Lançamento atualizado");
    }else{
      const xp=g("x-parc");
      if(xp&&xp.checked){
        const n=parseInt(g("x-n").value,10),k0=parseInt(g("x-k").value,10)||1;
        if(!(n>=2&&n<=120)||k0>n){toast("Informe o nº de parcelas (2 a 120).");btn.disabled=false;btn.textContent="Salvar";return;}
        for(let k=k0,i=0;k<=n;k++,i++){const it={...base,secao:"parcela",parcela:String(k).padStart(2,"0")+"/"+String(n).padStart(2,"0"),id:uid()};await mutarMes(addM(mes,i),d=>d.itens.push(it));}
        toast(`${n-k0+1} parcelas lançadas até ${mLabel(addM(mes,n-k0))}`);
      }else{
        const rep=g("x-rep")?parseInt(g("x-rep").value,10)||0:0;
        for(let i=0;i<=rep;i++){const it={...base,id:uid()};if(i&&it.data){const nm=addM(mOf(it.data),i);const [yy,mo]=nm.split("-").map(Number);const dim=new Date(yy,mo,0).getDate();it.data=nm+"-"+String(Math.min(+it.data.slice(8,10),dim)).padStart(2,"0");}await mutarMes(addM(mes,i),d=>d.itens.push(it));}
        toast(rep?`Lançado em ${rep+1} meses`:"Lançado");
      }
    }
    fecharForm();
  }catch(e){toast("Não foi possível salvar. Verifique a conexão e tente de novo.");btn.disabled=false;btn.textContent="Salvar";}
}
async function excluirForm(){
  const b=document.getElementById("f-del");
  if(!M.confirmDel){M.confirmDel=true;b.textContent="Toque de novo para excluir";return;}
  b.disabled=true;
  try{const id=M.orig.id;await mutarMes(M.origMes,d=>{d.itens=d.itens.filter(x=>x.id!==id);});toast("Lançamento excluído");fecharForm();}
  catch(e){toast("Não foi possível excluir.");b.disabled=false;}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-action]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;try{localStorage.setItem("fin.tab",S.tab);}catch(_){}render();window.scrollTo({top:0});return;}
  if(t.id==="m-prev"||t.id==="m-next"){const l=listaMeses();const i=l.indexOf(S.mes)+(t.id==="m-next"?1:-1);S.mes=i<0?addM(S.mes,-1):i>=l.length?addM(S.mes,1):l[i];render();return;}
  if(t.id==="btn-login"){entrar();return;}
  if(t.id==="btn-logout"){sair();return;}
  if(t.id==="btn-cfg"){const v=document.getElementById("cfg-txt").value.trim();
    try{
      let j=v.slice(v.indexOf("{"),v.lastIndexOf("}")+1).replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,"}");
      j=JSON.parse(j);
      if(!j.apiKey||!j.projectId)throw new Error("faltam apiKey/projectId");
      localStorage.setItem("fin.fbconfig",JSON.stringify(j));location.reload();
    }catch(e){toast("Configuração inválida: "+e.message);}return;}
  if(t.dataset.action==="importar"){importarPlanilha();return;}
  if(t.dataset.action==="backup-json"){backupJSON();return;}
  if(t.dataset.action==="backup-csv"){backupCSV();return;}
  if(t.id==="fab"){if(!S.db){toast("Sem conexão com os dados.");return;}
    if(S.tab==="investimentos")abrirFormInv(null);else abrirForm(null,S.mes);return;}
  if(t.dataset.mtipo&&MI){MI.tipo=t.dataset.mtipo;document.querySelectorAll("#v-tipo button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mtipo===MI.tipo));return;}
  if(t.id==="i-cancel"){fecharForm();return;}
  if(t.id==="i-save"){salvarInv();return;}
  if(t.id==="i-del"){excluirInv();return;}
  if(t.id==="v-save"){salvarMov();return;}
  if(t.dataset.filtro){S.filtro.secao=t.dataset.filtro;render();return;}
  if(t.dataset.relTipo){S.relTipo=t.dataset.relTipo;render();return;}
  if(t.dataset.relModo){S.relModo=t.dataset.relModo;render();return;}
  if(t.dataset.sec&&M){M.secao=t.dataset.sec;atualizarForm();return;}
  if(t.id==="f-cancel"){fecharForm();return;}
  if(t.id==="f-save"){salvarForm();return;}
  if(t.id==="f-del"){excluirForm();return;}
  const a=t.dataset.action;
  if(a==="editar"){const it=itens(t.dataset.mes).find(x=>x.id===t.dataset.id);if(it)abrirForm(it,t.dataset.mes);return;}
  if(a==="ver-cartao"){S.tab="lancamentos";S.filtro={secao:"todos",q:"",forma:t.dataset.nome};render();window.scrollTo({top:0});return;}
  if(a==="salvar-cartao"){const i=+t.dataset.idx;const fe=parseInt(document.getElementById("fe-"+i).value,10),ve=parseInt(document.getElementById("ve-"+i).value,10);
    if(!(fe>=1&&fe<=31&&ve>=1&&ve<=31)){toast("Use dias entre 1 e 31.");return;}
    const cs=S.config.cartoes.map((c,j)=>j===i?{...c,fechamento:fe,vencimento:ve}:c);S.config={...S.config,cartoes:cs};
    salvarConfig(S.config).then(()=>toast("Datas do cartão salvas")).catch(()=>toast("Não foi possível salvar."));render();return;}
  if(a==="ics"){baixarArquivo("contas-da-casa.ics",icsTexto(),"text/calendar");return;}
  if(a==="gcal"){enviarGoogleAgenda();return;}
  if(a==="inv-novo"){if(!S.db){toast("Sem conexão com os dados.");return;}abrirFormInv(null);return;}
  if(a==="inv-edit"){abrirFormInv(S.invest[t.dataset.id]);return;}
  if(a==="inv-mov"){abrirFormMov(t.dataset.id);return;}
  if(a==="inv-movs"){S.invAberto=S.invAberto===t.dataset.id?null:t.dataset.id;render();return;}
  if(a==="inv-mov-del"){const id=t.dataset.id,mid=t.dataset.mid;
    mutarInv(id,d=>{d.movs=(d.movs||[]).filter(x=>x.id!==mid);}).then(()=>toast("Movimentação excluída. O saldo atual não mudou, ajuste em 'Editar saldo' se precisar.")).catch(()=>toast("Não foi possível excluir."));return;}
  if(a==="salvar-conta"){const v=parseValor(document.getElementById("c-saldo").value),d=document.getElementById("c-data").value;
    const conta=isFinite(v)?{saldo:v,data:d||hojeD()}:null;
    mutarMes(S.mes,doc=>{if(conta)doc.conta=conta;else delete doc.conta;}).then(()=>toast("Saldo salvo")).catch(()=>toast("Não foi possível salvar."));return;}
});
document.addEventListener("click",e=>{if(e.target.id==="ov")fecharForm();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(M||MI))fecharForm();if(e.key==="Enter"&&M&&e.target.tagName==="INPUT"&&e.target.type!=="checkbox"){e.preventDefault();salvarForm();}});
document.addEventListener("input",e=>{
  if(e.target.matches("[data-money]"))maskMoney(e.target);
  if(e.target.id==="busca"){S.filtro.q=e.target.value;render();}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="m-sel"){S.mes=e.target.value;render();}
  else if(id==="f-forma-filtro"){S.filtro.forma=e.target.value;render();}
  else if(id==="estimar"){S.estimar=e.target.checked;render();}
  else if(id==="f-mes"&&M){M.mesManual=true;sugerirMes();}
  else if((id==="f-data"||id==="f-forma")&&M){if(M.novo)M.mesManual=false;sugerirMes();}
  else if(id==="x-parc"&&M&&e.target.checked&&M.secao==="variavel"){M.secao="parcela";atualizarForm();}
});

render();
conectar();
})();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
